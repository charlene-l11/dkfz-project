# Full spectral grid and optional manual channel selection.
# Use null for all wavelengths, or combine exact values and inclusive ranges.
forward_stepwise_analysis: false
forward_stop_wavelength: 995

reverse_stepwise_analysis: false
reverse_stop_wavelength: 500

# Optional exhaustive combination search. When enabled, wavelength.selective
# must be null and both stepwise modes above must be false.
combination_analysis:
  enabled: false
  min: 500
  max: 700
  n_wavelengths: 3
  fixed_wavelengths: []

wavelength:
  min: 500 # do not change
  max: 995 # do not change
  selective: 500-995
              #1: 630; 810           #500-515; 580; 600-610; 995
              #2: 540; 560
              #3: 910; 780

splitting:
  train_ratio: 0.60
  val_ratio: 0.20
  test_ratio: 0.20
  seed: 42
  search_attempts: 20000
  require_all_classes_in: [train, val, test]

training:
  seed: 42
  max_epochs: 150
  batch_size: 64
  learning_rate: 0.0002
  accelerator: auto
  devices: 1
  precision: 32-true
  num_workers: 0
  epoch_size: null
  standardize: false
  checkpoint_metric: accuracy

  # Exactly one strategy: none, class_weighting, or balanced_oversampling.
  imbalance:
    strategy: balanced_oversampling

evaluation:
  formats: [csv, png, pdf]
  dpi: 300
