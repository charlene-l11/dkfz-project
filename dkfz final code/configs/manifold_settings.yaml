# Optional cross-animal testing. When enabled, the primary dataset above is
# used only for training/validation and every recording below is used for test.
# External class keys may differ from the training classes, but they must match
# across the three external mappings. Every folder must be a complete path.
external_testing:
  enabled: false
  # experiment_folders: {}
  # labelling_file: {}
  # hyperguis: {}

data:
  # true: use the CSV inside _L1pixel; false: use the normal median CSV.
  use_l1pixel: false
  expected_channels: 100
  annotation_name: csv_spectrum
  patterns:
    - "spectrum_fromCSV1_(500.0-995.0)_masked_data_0_derivative.csv"
    - "spectrum_fromCSV1_(500.0-995.0)*_masked_data_0_derivative.csv"

# Full spectral grid and optional manual channel selection.
# Use null for all wavelengths, or combine exact values and inclusive ranges.
stepwise_analysis: false
reverse_stepwise: false
forward_stop_wavelength: 995
reverse_stop_wavelength: 500

wavelength:
  min: 500
  max: 995
  selective:
    1: "630; 810"
    2: "575; 650"
    3: "630; 785"
    4: "865; 875"
    5: "595; 930"

splitting:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  search_attempts: 20000
  require_all_classes_in: [train, val, test]

training:
  seed: 42
  max_epochs: 150
  batch_size: 64
  learning_rate: 0.0002
  accelerator: auto
  devices: 1
  precision: 32-true
  num_workers: 0
  epoch_size: null
  standardize: true
  checkpoint_metric: accuracy

  # Exactly one strategy: none, class_weighting, or balanced_oversampling.
  imbalance:
    strategy: balanced_oversampling

evaluation:
  formats: [csv, png, pdf]
  dpi: 300
